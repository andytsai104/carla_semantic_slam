# Phase 3: RTAB-Map RGB-D SLAM configuration
# Used by scripts/reconstruct_semantic_map_from_slam.py.

input:
  run_dir: data/raw/run_001
  slam_pose_csv: outputs/slam/run_001/slam_poses.csv
  frame_timestamps_csv: outputs/slam/run_001/frame_timestamps.csv

output:
  pointcloud_path: outputs/maps/semantic_map_slam_run_001.ply
  npz_path: outputs/maps/semantic_map_slam_run_001.npz
  label_summary_csv: outputs/maps/semantic_map_slam_run_001_label_summary.csv
  label_summary_json: outputs/maps/semantic_map_slam_run_001_label_summary.json

projection:
  pixel_stride: 4
  min_depth_m: 0.5
  max_depth_m: 80.0
  ignore_labels: [0, 13]
  max_points_per_frame: 8000

processing:
  sample_stride: 1
  max_samples:
  # Match each replayed image frame to the nearest /odom pose by ROS replay timestamp.
  # 0.20 sec is safe for 1 Hz replay. You can try 0.10 if matches are too loose.
  max_time_diff_sec: 0.20

slam_pose:
  # Your current logged pose is /odom -> base_link.
  pose_source: odom
  pose_frame: base_link

  # The mapper uses:
  #   P_odom = T_odom_base @ T_base_camera @ P_camera
  # If source=metadata, this is read from metadata['config']['sensors']['camera']['transform'].
  # Your current collection config is x=1.5, y=0.0, z=2.4, roll=pitch=yaw=0.
  camera_extrinsic:
    source: metadata
    # To override manually, change source to manual and uncomment/edit values below.
    # source: manual
    # x: 1.5
    # y: 0.0
    # z: 2.4
    # roll: 0.0
    # pitch: 0.0
    # yaw: 0.0

visualization:
  voxel_size: 0.15

ros_topics:
  rgbd_image: /rgbd_image
  rgb_image: /camera/color/image_raw
  depth_image: /camera/depth/image_rect_raw
  camera_info: /camera/color/camera_info
  odom: /odom
